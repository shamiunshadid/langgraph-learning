[project]
name = "langgraph-complete"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shamiun Shadid", email = "shamiunshadid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "streamlit>=1.66.1",
]

[project.scripts]
langgraph-complete = "langgraph_complete:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
